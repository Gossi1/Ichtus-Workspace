<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ichtus — Server niet bereikbaar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e1e1e;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #242424;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    }
    .icon {
      font-size: 56px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 22px;
      color: #fff;
      margin-bottom: 12px;
    }
    p {
      color: #999;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .retry-btn {
      background: #f47920;
      color: #fff;
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .retry-btn:hover { background: #e06a15; }
    .details {
      margin-top: 24px;
      font-size: 12px;
      color: #666;
      border-top: 1px solid #333;
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔌</div>
    <h1>Server niet bereikbaar</h1>
    <p>De Ichtus server draait niet of is niet bereikbaar.<br>
       Controleer of de service actief is op de server.</p>
    <button class="retry-btn" onclick="location.reload()">Opnieuw proberen</button>
    <div class="details">
      Ichtus Workspace · Server offline
    </div>
  </div>
</body>
</html>
